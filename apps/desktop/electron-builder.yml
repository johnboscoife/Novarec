appId: com.novarec.app
productName: NovaRec
copyright: Copyright © 2026 NovaRec
# electron-builder 26 needs an exact Electron version; also pinned in
# package.json devDependencies for reproducible installs.
electronVersion: 43.2.0

directories:
  buildResources: build
  output: release/${version}

# electron-vite emits self-contained bundles into out/; internal source-only
# workspace packages are bundled in. The one external runtime dependency is the
# bundled static FFmpeg binary used for export.
files:
  - out/**/*
  - package.json
  - node_modules/ffmpeg-static/**
  - '!**/{.eslintrc.*,.prettierrc.*,tsconfig*.json,*.map}'

asar: true
# FFmpeg must live outside the asar so it's an executable file on disk.
asarUnpack:
  - node_modules/ffmpeg-static/**
npmRebuild: false

# Auto-updates are WIRED in the app (src/main/auto-update.ts) but INERT until a
# release feed exists. To enable: (1) uncomment a `publish` provider below and
# fill in your hosting, (2) add `node_modules/electron-updater/**` (and its deps)
# to `files` so the module is packaged, then build & publish. electron-builder
# will emit app-update.yml and the app will auto-check on launch. Until then the
# updater no-ops (no failed network calls), so it's safe to ship as-is.
# publish:
#   provider: github        # or: generic (with a `url:`), s3, spaces, …
#   owner: your-org
#   repo: novarec

win:
  icon: build/icon.png
  target:
    - nsis
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

mac:
  target:
    - dmg
  category: public.app-category.productivity

linux:
  target:
    - AppImage
    - deb
  category: AudioVideo
  maintainer: NovaRec
