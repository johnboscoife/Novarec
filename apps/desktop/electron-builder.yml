appId: com.novarec.app
productName: NovaRec
copyright: Copyright © 2026 Ife Solutions Ltd
# electron-builder 26 needs an exact Electron version; also pinned in
# package.json devDependencies for reproducible installs.
electronVersion: 43.2.0

directories:
  buildResources: build
  output: release/${version}

# electron-vite emits self-contained bundles into out/; internal source-only
# workspace packages are bundled in. The one external runtime dependency is the
# bundled static FFmpeg binary used for export.
files:
  - out/**/*
  - package.json
  - node_modules/ffmpeg-static/**
  - '!**/{.eslintrc.*,.prettierrc.*,tsconfig*.json,*.map}'

asar: true
# FFmpeg must live outside the asar so it's an executable file on disk.
asarUnpack:
  - node_modules/ffmpeg-static/**
npmRebuild: false

# Auto-updates: releases are published to GitHub Releases; electron-builder emits
# app-update.yml into resources, and the app (src/main/auto-update.ts) checks it
# on launch. electron-updater and its deps are already packaged (they're
# production dependencies, so electron-builder includes them automatically).
# The releases repo is public, so updates download without any embedded token.
publish:
  provider: github
  owner: johnboscoife
  repo: Novarec
  releaseType: release

win:
  icon: build/icon.png
  # The publisher shown by Windows comes from the signature, so it appears once
  # these builds are code-signed — electron-builder 26 takes it as
  # `win.signtoolOptions.publisherName` (setting it on an UNSIGNED build makes
  # electron-updater's signature check fail, so it is deliberately absent).
  # Until then, "Ife Solutions Ltd" reaches the executable via `copyright` above
  # and the `author` field in package.json (the exe's CompanyName).
  target:
    - nsis
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # Terms of Use + MIT licence + privacy notice, shown as the agreement page the
  # user must accept before installing.
  license: build/license.txt
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: NovaRec
  menuCategory: false
  uninstallDisplayName: ${productName} ${version}
  runAfterFinish: true
  # Uninstalling must never destroy someone's recordings or settings.
  deleteAppDataOnUninstall: false

mac:
  icon: build/icon.png
  # Built per architecture: the bundled FFmpeg is downloaded for the machine
  # running `pnpm install`, so a build only ships a working FFmpeg for that
  # arch. Build on Apple Silicon for arm64, on an Intel Mac for x64.
  target:
    - target: dmg
  category: public.app-category.productivity
  # Without these strings macOS terminates the app the moment it asks for the
  # camera or microphone, rather than showing the permission prompt.
  extendInfo:
    NSCameraUsageDescription: NovaRec uses your camera to record it into your videos and meetings.
    NSMicrophoneUsageDescription: NovaRec uses your microphone to record your voice in videos and meetings.
  # Until a Developer ID certificate is configured, builds are ad-hoc signed
  # (`-`): enough for Apple Silicon to launch the app, but not notarized, so
  # Gatekeeper asks the user to approve it once. With a real identity, switch
  # on hardenedRuntime and notarization.
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

linux:
  target:
    - AppImage
    - deb
  category: AudioVideo
  maintainer: NovaRec
