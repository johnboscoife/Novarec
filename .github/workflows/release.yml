name: Release

# Push a version tag (e.g. v0.0.32, matching apps/desktop/package.json) and this
# builds the Windows installer and publishes it — plus the latest.yml update
# metadata electron-updater needs — to a DRAFT GitHub Release. Review the draft,
# then hit "Publish release" so installed apps auto-update to it on next launch.
#
# Code signing is optional (unsigned builds show a SmartScreen warning on first
# run). Add the CSC_* secrets below to sign.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & publish Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build & publish to GitHub Releases
        # electron-builder creates/updates a DRAFT release for this tag and
        # uploads the .exe, its .blockmap, and latest.yml (the update feed).
        run: pnpm --filter @novarec/desktop release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- Code signing (optional) — add as repository secrets to enable. ---
          # CSC_LINK: ${{ secrets.WINDOWS_CERT_BASE64 }}
          # CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
