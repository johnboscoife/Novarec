name: Release

# Push a version tag (e.g. v0.0.46, matching apps/desktop/package.json) and this
# builds the Windows installer and publishes it — plus the latest.yml update
# metadata electron-updater needs — to a GitHub Release. `releaseType: release`
# in electron-builder.yml means it goes live immediately; switch that to `draft`
# if a review gate is wanted.
#
# Code signing is optional (unsigned builds show a SmartScreen warning on first
# run). Add the CSC_* secrets below to sign.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & publish Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      # A release that cannot start is worse than no release. Same guard as CI.
      - name: Smoke test (launch the built app)
        run: pnpm --filter @novarec/desktop build:dir && pnpm test:e2e

      # electron-builder uploads its artifacts in PARALLEL, and every upload
      # that finds no release for the tag tries to CREATE one. That race lost
      # the installer once: two concurrent "creating GitHub release" attempts,
      # one won, and the loser abandoned its upload — leaving a release with
      # nothing in it but a .blockmap, and no latest.yml for auto-update.
      # Creating the release up front means every upload finds it already there.
      - name: Create the release up front
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && exit 0
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "Release notes: https://github.com/${GITHUB_REPOSITORY}/blob/master/docs/RELEASE-NOTES.md" \
            --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & publish to GitHub Releases
        # Uploads the .exe, its .blockmap, and latest.yml (the update feed) to
        # the release created above.
        run: pnpm --filter @novarec/desktop release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `releaseType: release` in electron-builder.yml only applies to a release
      # electron-builder CREATED itself. Handed the one made above, it leaves it
      # as a draft — and a draft is invisible to electron-updater, so installed
      # copies would never see the update. Publish it explicitly.
      - name: Publish the release
        shell: bash
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- Code signing (optional) — add as repository secrets to enable. ---
          # CSC_LINK: ${{ secrets.WINDOWS_CERT_BASE64 }}
          # CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
