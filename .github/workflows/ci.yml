name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality & build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

      # Validate the Electron bundle + packaging on every platform without
      # code-signing/notarization (those need secrets — wired up in Phase 10).
      - name: Build desktop (unpacked)
        run: pnpm --filter @novarec/desktop build:dir

      # Actually LAUNCH what was just built. `build:dir` succeeds happily when a
      # workspace package is wrongly externalized — the app then dies on startup
      # trying to require() a .ts file out of app.asar, which is how a
      # launch-blocking crash once shipped. Building is not evidence it runs.
      # Skipped on Linux, which needs a virtual display; the failure mode this
      # guards against is platform-independent.
      - name: Smoke test (launch the built app)
        if: runner.os != 'Linux'
        run: pnpm test:e2e
